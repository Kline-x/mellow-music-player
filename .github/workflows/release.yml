name: Mellow Music Release Pipeline (Multiplatform)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Windows x64 桌面向导安装包构建 (Inno Setup Installer)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Tests
        working-directory: app
        run: flutter test

      - name: Build Windows Release
        working-directory: app
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" app/windows/installer.iss
          Move-Item app/windows/Mellow-Music-Windows-x64-Setup.exe .
          # 同时保留绿色免安装版供便携用户选择
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath Mellow-Music-Windows-x64-Portable.zip

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-Windows-x64-Setup
          path: Mellow-Music-Windows-x64-Setup.exe

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-Windows-x64-Portable
          path: Mellow-Music-Windows-x64-Portable.zip

  # ---------------------------------------------------------------------------
  # 2. macOS 桌面磁盘映像安装包构建 (DMG Installer)
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS DMG Installer
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Tests
        working-directory: app
        run: flutter test

      - name: Build macOS Release
        working-directory: app
        run: flutter build macos --release

      - name: Package macOS DMG Installer
        run: |
          APP_PATH=$(find app/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n1)
          test -n "$APP_PATH" || { echo "macOS .app not found"; exit 1; }
          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "Mellow Music" -srcfolder dmg_temp -ov -format UDZO Mellow-Music-macOS.dmg
          rm -rf dmg_temp
          # 同时保留通用压缩包
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Mellow-Music-macOS.zip

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-macOS-DMG
          path: Mellow-Music-macOS.dmg

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-macOS-Zip
          path: Mellow-Music-macOS.zip

  # ---------------------------------------------------------------------------
  # 3. Linux x64 原生安装包构建 (.deb Installer)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux x64 DEB Installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev dpkg-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Tests
        working-directory: app
        run: flutter test

      - name: Build Linux Release
        working-directory: app
        run: flutter build linux --release

      - name: Package Linux .deb Installer
        run: |
          cd app
          bash linux/package_deb.sh
          mv Mellow-Music-Linux-amd64.deb ../
          cd ..
          tar -czvf Mellow-Music-Linux-x64-Portable.tar.gz -C app/build/linux/x64/release/bundle .

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-Linux-DEB
          path: Mellow-Music-Linux-amd64.deb

      - name: Upload Linux Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-Linux-Portable
          path: Mellow-Music-Linux-x64-Portable.tar.gz

  # ---------------------------------------------------------------------------
  # 4. Android 原生安装包构建 (.apk Installer)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Copy and Rename APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk Mellow-Music-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-Android
          path: Mellow-Music-Android.apk

  # ---------------------------------------------------------------------------
  # 5. iOS 移动端原生安装包 (.ipa Installer) 构建
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA
        run: |
          mkdir -p Payload
          cp -r app/build/ios/iphoneos/Runner.app Payload/
          zip -r Mellow-Music-iOS.ipa Payload
          ditto -c -k --sequesterRsrc --keepParent app/build/ios/iphoneos/Runner.app Mellow-Music-iOS-App.zip

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-iOS
          path: Mellow-Music-iOS.ipa

      - name: Upload iOS App Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-iOS-App
          path: Mellow-Music-iOS-App.zip

  # ---------------------------------------------------------------------------
  # 6. Web / PWA 生产产物编译与打包
  # ---------------------------------------------------------------------------
  build-web:
    name: Build Web & PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Web Release
        working-directory: app
        run: flutter build web --release

      - name: Package Web Files
        run: |
          tar -czvf Mellow-Music-Web.tar.gz -C app/build/web .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-Music-Web
          path: Mellow-Music-Web.tar.gz

  # ---------------------------------------------------------------------------
  # 7. 全平台正式发版 (Publish GitHub Multiplatform Native Installers)
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Multiplatform Native Installers
    needs: [build-windows, build-macos, build-linux, build-android, build-ios, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mellow Music · 润音 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: CHANGELOG_LATEST.md

          files: |
            release-assets/Mellow-Music-Windows-x64-Setup.exe
            release-assets/Mellow-Music-Windows-x64-Portable.zip
            release-assets/Mellow-Music-macOS.dmg
            release-assets/Mellow-Music-macOS.zip
            release-assets/Mellow-Music-Linux-amd64.deb
            release-assets/Mellow-Music-Linux-x64-Portable.tar.gz
            release-assets/Mellow-Music-Android.apk
            release-assets/Mellow-Music-iOS.ipa
            release-assets/Mellow-Music-iOS-App.zip
            release-assets/Mellow-Music-Web.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Mellow Music Continuous Integration (Quality Gate)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality-and-desktop-tests:
    name: Code Quality & Desktop Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Static Code Analysis (0 Issues Gate)
        working-directory: app
        run: flutter analyze

      - name: Run Full Test Suites (Including Desktop Native E2E Journeys)
        working-directory: app
        run: flutter test

  build-windows-desktop-client:
    name: Build Windows Desktop Release Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows Desktop Release Binary (.exe)
        working-directory: app
        run: flutter build windows --release

      - name: Archive and Upload Windows Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: mellow-music-windows-x64-release
          path: app/build/windows/x64/runner/Release/
